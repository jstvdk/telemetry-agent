# camera-in-a-box: run against the software mock instead of hardware. The lab launcher lets
# the mock send plausible per-module packets (realistic), the constant example, or random ones.
[Service]
Environment=LAB_SLOWSIGNAL_PACKETS=realistic
ExecStart=
ExecStart=%h/miniforge3/envs/sstcam/bin/python /opt/sstcam/lab/sstcam_lab.py slowsignal serve --mock
