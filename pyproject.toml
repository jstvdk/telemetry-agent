[project]
name = "shiftassist"
version = "0.1.0"
description = "Read-only LLM shift assistant over instrument telemetry: deterministic detection, grounded explanations, measured evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vadym Voitsekhovskyi" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pyzmq>=26",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "mcp>=2"]
baseline = ["anthropic>=0.40", "mcp>=2", "pandas>=2"]

[project.scripts]
shiftassist-sim = "shiftassist.sim.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shiftassist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: calls a real LLM endpoint (costs money; excluded from CI)",
    "zmq: opens local sockets",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["baseline"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
